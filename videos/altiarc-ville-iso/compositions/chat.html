<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: "Outfit", sans-serif;
          color: #ffffff;
        }
        #chat-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          perspective: 1600px;
        }
        #chat-panel {
          width: 1100px;
          height: 660px;
          border-radius: 28px;
          background: rgba(20, 20, 27, 0.94);
          border: 2px solid rgba(129, 140, 248, 0.38);
          box-shadow:
            0 40px 120px rgba(0, 0, 0, 0.6),
            0 0 80px rgba(129, 140, 248, 0.16);
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        #chat-head {
          display: flex;
          align-items: center;
          gap: 22px;
          padding: 30px 44px;
          border-bottom: 2px solid rgba(255, 255, 255, 0.07);
        }
        #chat-avatar {
          width: 64px;
          height: 64px;
          border-radius: 18px;
          background: #1e1e2b;
          border: 2px solid #c084fc;
          box-shadow: 0 0 26px rgba(192, 132, 252, 0.45);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #chat-avatar-core {
          width: 22px;
          height: 22px;
          border-radius: 6px;
          background: #c084fc;
          display: block;
        }
        #chat-title {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        #chat-name {
          font-size: 36px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        #chat-sub {
          font-family: "Space Mono", monospace;
          font-size: 20px;
          letter-spacing: 0.08em;
          color: rgba(255, 255, 255, 0.6);
        }
        #chat-pill {
          margin-left: auto;
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 20px;
          border-radius: 999px;
          background: rgba(129, 140, 248, 0.14);
          border: 2px solid rgba(129, 140, 248, 0.5);
          font-family: "Space Mono", monospace;
          font-size: 24px;
          font-weight: 700;
          color: #c7cbff;
        }
        #chat-pill-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #818cf8;
          display: block;
        }
        #chat-time {
          font-family: "Space Mono", monospace;
          font-size: 24px;
          color: rgba(255, 255, 255, 0.6);
        }
        #chat-body {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 26px;
          padding: 40px 44px;
        }
        .chat-row {
          display: flex;
          width: 100%;
        }
        #chat-row-client {
          justify-content: flex-end;
        }
        .chat-bubble {
          max-width: 680px;
          padding: 22px 30px;
          border-radius: 26px;
          font-size: 34px;
          line-height: 1.3;
        }
        #chat-client {
          background: #262633;
          border-bottom-right-radius: 8px;
        }
        #chat-ai {
          background: rgba(129, 140, 248, 0.16);
          border: 2px solid rgba(129, 140, 248, 0.45);
          border-bottom-left-radius: 8px;
          min-height: 92px;
          width: 680px;
        }
        #chat-typing {
          display: flex;
          gap: 12px;
          padding: 28px 32px;
          border-radius: 26px;
          background: rgba(129, 140, 248, 0.16);
          border: 2px solid rgba(129, 140, 248, 0.45);
          position: absolute;
        }
        .chat-dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #c084fc;
          display: block;
        }
        #chat-row-ai {
          position: relative;
        }
        #chat-cta-row {
          padding-left: 0;
        }
        #chat-cta {
          position: relative;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 18px 30px;
          border-radius: 999px;
          border: 2px solid #c9a84c;
          background: rgba(201, 168, 76, 0.12);
          color: #e9d49a;
          font-size: 30px;
          font-weight: 600;
        }
        #chat-cta-ring {
          position: absolute;
          inset: -2px;
          border-radius: 999px;
          border: 2px solid #c9a84c;
          display: block;
        }
      </style>

      <div data-hf-id="hf-cgnh" id="root" data-composition-id="chat" data-width="1920" data-height="1080">
        <div data-hf-id="hf-qn86" id="chat-stage">
          <div data-hf-id="hf-69s6" id="chat-panel">
            <div data-hf-id="hf-9xfu" id="chat-head">
              <div data-hf-id="hf-26i7" id="chat-avatar"><span data-hf-id="hf-ruoa" id="chat-avatar-core"></span></div>
              <div data-hf-id="hf-mtta" id="chat-title">
                <div data-hf-id="hf-6yg7" id="chat-name">Assistant IA</div>
                <div data-hf-id="hf-7j76" id="chat-sub">CENTRE D'APPELS · EN LIGNE</div>
              </div>
              <div data-hf-id="hf-z0p5" id="chat-pill"><span data-hf-id="hf-42di" id="chat-pill-dot"></span>24/7</div>
              <div data-hf-id="hf-atmn" id="chat-time">23:47</div>
            </div>
            <div data-hf-id="hf-n1c0" id="chat-body">
              <div data-hf-id="hf-khmm" class="chat-row" id="chat-row-client">
                <div data-hf-id="hf-zwqu" class="chat-bubble" id="chat-client">Vous êtes ouverts dimanche ?</div>
              </div>
              <div data-hf-id="hf-k74h" class="chat-row" id="chat-row-ai">
                <div data-hf-id="hf-q10d" id="chat-typing">
                  <span data-hf-id="hf-p9uh" class="chat-dot"></span><span data-hf-id="hf-owz1" class="chat-dot"></span><span data-hf-id="hf-q3w4" class="chat-dot"></span>
                </div>
                <div data-hf-id="hf-z95w" class="chat-bubble" id="chat-ai"></div>
              </div>
              <div data-hf-id="hf-3rir" class="chat-row" id="chat-cta-row">
                <div data-hf-id="hf-1dxq" id="chat-cta"><span data-hf-id="hf-xqj0" id="chat-cta-ring"></span>Réserver dimanche 10 h</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const REPLY = "Oui, de 10 h à 13 h. Je vous réserve un créneau ?";
          const ai = document.getElementById("chat-ai");

          // Unfold out of the building roof (screen centre), tilt-to-flatten.
          tl.fromTo(
            "#chat-panel",
            { scale: 0.12, rotationX: 58, y: 140, opacity: 0 },
            { scale: 1, rotationX: 0, y: 0, opacity: 1, duration: 0.62, ease: "power4.out" },
            0,
          );
          tl.fromTo("#chat-head > *", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.06, ease: "power3.out" }, 0.32);
          tl.fromTo("#chat-pill-dot", { scale: 1 }, { scale: 1.5, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.5);

          // Client message.
          tl.fromTo("#chat-client", { opacity: 0, x: 60, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, 0.62);

          // Typing indicator, then the AI reply types itself.
          tl.fromTo("#chat-typing", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 0.95);
          tl.fromTo(".chat-dot", { y: 0 }, { y: -10, duration: 0.14, stagger: 0.07, repeat: 1, yoyo: true, ease: "sine.inOut" }, 1.0);
          tl.fromTo("#chat-typing", { opacity: 1 }, { opacity: 0, duration: 0.08, immediateRender: false }, 1.26);
          tl.fromTo("#chat-ai", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 1.3);
          const typed = { n: 0 };
          tl.fromTo(
            typed,
            { n: 0 },
            {
              n: REPLY.length,
              duration: 0.85,
              ease: "none",
              onUpdate: () => {
                ai.textContent = REPLY.slice(0, Math.round(typed.n));
              },
            },
            1.42,
          );

          // Ready-to-use result: the booking button.
          tl.fromTo("#chat-cta", { opacity: 0, scale: 0.7, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 2.3);
          tl.fromTo("#chat-cta-ring", { scale: 1, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.55, ease: "power2.out" }, 2.55);

          // Fold back into the building.
          tl.to("#chat-panel", { scale: 0.1, rotationX: 50, y: 150, opacity: 0, duration: 0.42, ease: "power2.in" }, 2.95);

          window.__timelines["chat"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
