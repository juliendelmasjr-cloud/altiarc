<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0c0c0c;
        }
        #city-fx {
          position: absolute;
          inset: 0;
          will-change: filter, opacity;
        }
        #city-canvas {
          display: block;
          width: 100%;
          height: 100%;
        }
        #city-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 75% 75% at 50% 50%, rgba(12, 12, 12, 0) 58%, rgba(12, 12, 12, 0.6) 82%, rgba(12, 12, 12, 0.92) 100%);
          display: block;
        }
      </style>

      <div data-hf-id="hf-ppzw" id="root" data-composition-id="city" data-width="1920" data-height="1080">
        <div data-hf-id="hf-hql7" id="city-fx">
          <canvas data-hf-id="hf-st5n" id="city-canvas" width="1920" height="1080" data-layout-allow-overflow=""></canvas>
          <span data-hf-id="hf-eo5a" id="city-vignette"></span>
        </div>
      </div>

      <script>
        // Hold the render until the WebGL city has drawn its first frame.
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["altiarc-city"] = new Promise((resolve) => {
          window.__altiarcCityReady = resolve;
        });

        (function () {
          // Depth treatment while a screen is open over the city, then the hand-off to the signature.
          const tl = gsap.timeline({ paused: true });
          const OPEN = "blur(7px) brightness(0.42)";
          const SOFT = "blur(3px) brightness(0.55)";
          const CLEAR = "blur(0px) brightness(1)";
          tl.fromTo("#city-fx", { filter: CLEAR }, { filter: OPEN, duration: 0.5, ease: "power2.out" }, 11.25);
          tl.fromTo("#city-fx", { filter: OPEN }, { filter: CLEAR, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 14.2);
          tl.fromTo("#city-fx", { filter: CLEAR }, { filter: OPEN, duration: 0.5, ease: "power2.out", immediateRender: false }, 15.05);
          tl.fromTo("#city-fx", { filter: OPEN }, { filter: CLEAR, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 18.05);
          tl.fromTo("#city-fx", { filter: CLEAR }, { filter: SOFT, duration: 0.5, ease: "power2.out", immediateRender: false }, 18.95);
          tl.fromTo("#city-fx", { filter: SOFT }, { filter: CLEAR, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 21.35);
          tl.fromTo("#city-fx", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, 22.7);
          window.__timelines["city"] = tl;
        })();
      </script>
      <script type="module" src="city/city.js"></script>
    </template>
  </body>
</html>
