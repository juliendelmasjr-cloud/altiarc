<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Altiarc — La ville isométrique</title>
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/jsm/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0c0c0c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0c0c;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="26"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <!-- Track 0 — the isometric city (Three.js, one continuous camera) -->
      <div
        id="city"
        data-composition-id="city"
        data-composition-src="compositions/city.html"
        data-start="0"
        data-duration="23.4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Screens that unfold out of the buildings -->
      <div
        id="chat"
        data-composition-id="chat"
        data-composition-src="compositions/chat.html"
        data-start="11.2"
        data-duration="3.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="workflow"
        data-composition-id="workflow"
        data-composition-src="compositions/workflow.html"
        data-start="15.0"
        data-duration="3.5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="roi"
        data-composition-id="roi"
        data-composition-src="compositions/roi.html"
        data-start="18.9"
        data-duration="3.0"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Signature -->
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="22.6"
        data-duration="3.4"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      // The root only hosts the scenes; each scene owns its own timeline.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
