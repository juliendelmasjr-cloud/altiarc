              <div data-hf-id="hf-lu7h" id="cd-title">

                <div data-hf-id="hf-wx1j" id="cd-sub">CHATBOT ALTIARC · EN LIGNE</div>

                  <span data-hf-id="hf-ig01" id="cd-typing"><span data-hf-id="hf-c8im" class="cd-dot"></span><span data-hf-id="hf-6hvm" class="cd-dot"></span><span data-hf-id="hf-6w6n" class="cd-dot"></span></span>

                </div>

      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const REPLY = "Bien sûr ! Mardi 14 h ou jeudi 10 h ?";
          const out = document.getElementById("cd-ai-text");

          tl.fromTo("#cd-panel", { scale: 0.12, rotationX: 58, y: 140, opacity: 0 }, { scale: 1, rotationX: 0, y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 0);
          tl.fromTo("#cd-head > *", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05, ease: "power3.out" }, 0.28);
          tl.fromTo("#cd-pill-dot", { scale: 1 }, { scale: 1.5, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.4);
          tl.fromTo("#cd-q", { opacity: 0, x: 50, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, 0.32);

          tl.fromTo("#cd-ai", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 0.6);
          tl.fromTo(".cd-dot", { y: 0 }, { y: -9, duration: 0.12, stagger: 0.06, repeat: 1, yoyo: true, ease: "sine.inOut" }, 0.66);
          tl.fromTo("#cd-typing", { opacity: 1 }, { opacity: 0, duration: 0.06, immediateRender: false }, 0.94);
          const typed = { n: 0 };
          tl.fromTo(
            typed,
            { n: 0 },
            {
              n: REPLY.length,
              duration: 0.6,
              ease: "none",
              onUpdate: () => {
                out.textContent = REPLY.slice(0, Math.round(typed.n));
              },
            },
            0.96,
          );

          // Quick replies → the visitor taps "Mardi 14 h".
          tl.fromTo(".cd-chip", { opacity: 0, y: 16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, stagger: 0.08, ease: "back.out(1.8)" }, 1.55);
          tl.fromTo("#cd-chip-a-fill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 1.95);
          tl.fromTo("#cd-chip-a-label", { color: "#e9d49a" }, { color: "#14141b", duration: 0.15 }, 1.95);
          tl.fromTo("#cd-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power2.out" }, 1.95);
          tl.fromTo("#cd-chip-a", { scale: 1 }, { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 1.93);
          tl.fromTo("#cd-chip-b", { opacity: 1 }, { opacity: 0.35, duration: 0.2, immediateRender: false }, 2.0);

          // Ready-to-use result: the confirmed slot.
          tl.fromTo("#cd-confirm", { opacity: 0, scale: 0.7, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 2.15);

          // Fold back into the vitrine (the 3D calendar card takes over).
          tl.to("#cd-panel", { scale: 0.1, rotationX: 50, y: 150, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.68);

          window.__timelines["chat-day"] = tl;
        })();
      </script>
