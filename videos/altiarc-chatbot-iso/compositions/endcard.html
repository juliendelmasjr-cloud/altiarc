<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: "Outfit", sans-serif;
          color: #ffffff;
        }
        #ec-bg {
          position: absolute;
          inset: 0;
          background: #0c0c0c;
        }
        #ec-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1500px;
          height: 900px;
          margin-left: -750px;
          margin-top: -450px;
          background: radial-gradient(closest-side, rgba(129, 140, 248, 0.22), rgba(129, 140, 248, 0.06) 55%, rgba(129, 140, 248, 0) 100%);
          display: block;
        }
        #ec-lockup {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 26px;
        }
        #ec-mark-row {
          display: flex;
          align-items: baseline;
          gap: 10px;
        }
        #ec-word {
          display: block;
          font-size: 176px;
          font-weight: 800;
          line-height: 1;
          letter-spacing: -0.025em;
          color: #ffffff;
          padding-bottom: 10px;
        }
        #ec-dot {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 4px;
          width: 34px;
          height: 34px;
          border-radius: 6px;
          background: #c9a84c;
          box-shadow:
            0 0 28px rgba(201, 168, 76, 0.85),
            0 0 70px rgba(201, 168, 76, 0.4);
        }
        .ec-eye {
          width: 4px;
          height: 7px;
          border-radius: 3px;
          background: #14102a;
          display: block;
        }
        #ec-baseline {
          font-size: 50px;
          font-weight: 300;
          letter-spacing: 0.005em;
          color: rgba(255, 255, 255, 0.86);
        }
        #ec-url {
          margin-top: 14px;
          font-family: "Space Mono", monospace;
          font-size: 32px;
          letter-spacing: 0.1em;
          color: #c9a84c;
        }
      </style>

      <div data-hf-id="hf-32ii" id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
        <div data-hf-id="hf-6v8j" id="ec-bg"></div>
        <span data-hf-id="hf-ja5o" id="ec-glow"></span>
        <div data-hf-id="hf-9mhg" id="ec-lockup">
          <div data-hf-id="hf-4xoe" id="ec-mark-row">
            <div data-hf-id="hf-grus" id="ec-word">Altiarc</div>
            <span data-hf-id="hf-h1s0" id="ec-dot"><span data-hf-id="hf-5gv1" class="ec-eye"></span><span data-hf-id="hf-4typ" class="ec-eye"></span></span>
          </div>
          <div data-hf-id="hf-spf0" id="ec-baseline">Votre accueil, 24h/24.</div>
          <div data-hf-id="hf-ymn5" id="ec-url">altiarc.fr</div>
        </div>
      </div>

      <script>
        (function () {
          const build = () => {
            const tl = gsap.timeline({ paused: true });
            const word = document.getElementById("ec-word");
            const dot = document.getElementById("ec-dot");
            const wr = word.getBoundingClientRect();
            const dr = dot.getBoundingClientRect();
            const root = document.getElementById("root").getBoundingClientRect();
            const ox = root.left + root.width / 2 - (dr.left + dr.width / 2);
            const oy = root.top + root.height / 2 - (dr.top + dr.height / 2);
            const wordW = wr.width;
            const startX = wr.left - dr.left;

            tl.fromTo("#ec-bg", { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power1.inOut" }, 0.1);
            tl.fromTo("#ec-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0.45);

            // The chatbot arrives at screen centre as an indigo orb with its two eyes…
            tl.fromTo(
              dot,
              { x: ox, y: oy, scale: 0, borderRadius: "50%", backgroundColor: "#818cf8", boxShadow: "0 0 34px rgba(129,140,248,0.9), 0 0 80px rgba(129,140,248,0.45)" },
              { x: ox, y: oy, scale: 1.9, duration: 0.36, ease: "power3.out" },
              0.2,
            );
            // …then becomes the gold full stop of the wordmark.
            tl.fromTo(
              dot,
              { scale: 1.9, borderRadius: "50%", backgroundColor: "#818cf8", boxShadow: "0 0 34px rgba(129,140,248,0.9), 0 0 80px rgba(129,140,248,0.45)" },
              { scale: 1, borderRadius: "6px", backgroundColor: "#c9a84c", boxShadow: "0 0 28px rgba(201,168,76,0.85), 0 0 70px rgba(201,168,76,0.4)", duration: 0.36, ease: "power2.inOut", immediateRender: false },
              0.62,
            );
            tl.fromTo(".ec-eye", { opacity: 1 }, { opacity: 0, duration: 0.18, immediateRender: false }, 0.72);
            tl.fromTo(dot, { x: ox, y: oy }, { x: startX, y: 0, duration: 0.26, ease: "power3.inOut", immediateRender: false }, 1.02);

            // Sweep right: the wordmark is revealed right behind the module.
            const sweep = { x: startX };
            tl.fromTo(
              sweep,
              { x: startX },
              {
                x: 0,
                duration: 0.62,
                ease: "power3.out",
                onUpdate: () => {
                  gsap.set(dot, { x: sweep.x });
                  const right = Math.max(0, wordW - (sweep.x - startX));
                  word.style.clipPath = `inset(-20px ${right.toFixed(1)}px -20px -20px)`;
                },
              },
              1.3,
            );
            tl.fromTo(word, { clipPath: `inset(-20px ${wordW}px -20px -20px)` }, { clipPath: `inset(-20px ${wordW}px -20px -20px)`, duration: 0.01 }, 0);

            tl.fromTo("#ec-baseline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.78);
            tl.fromTo("#ec-url", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.95);
            window.__timelines["endcard"] = tl;
          };
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
          else build();
        })();
      </script>
    </template>
  </body>
</html>
