      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const REPLY = "Je transmets à notre commercial. Il vous rappelle demain à 9 h.";
          const out = document.getElementById("cn-ai-text");

          tl.fromTo("#cn-panel", { scale: 0.12, rotationX: 58, y: 140, opacity: 0 }, { scale: 1, rotationX: 0, y: 0, opacity: 1, duration: 0.58, ease: "power4.out" }, 0);
          tl.fromTo("#cn-head > *", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05, ease: "power3.out" }, 0.28);
          tl.fromTo("#cn-pill-dot", { scale: 1 }, { scale: 1.5, duration: 0.3, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.4);
          tl.fromTo("#cn-q", { opacity: 0, x: 50, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, 0.3);

          tl.fromTo("#cn-ai", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 0.58);
          tl.fromTo(".cn-dot", { y: 0 }, { y: -9, duration: 0.12, stagger: 0.06, repeat: 1, yoyo: true, ease: "sine.inOut" }, 0.64);
          tl.fromTo("#cn-typing", { opacity: 1 }, { opacity: 0, duration: 0.06, immediateRender: false }, 0.9);
          const typed = { n: 0 };
          tl.fromTo(
            typed,
            { n: 0 },
            {
              n: REPLY.length,
              duration: 0.7,
              ease: "none",
              onUpdate: () => {
                out.textContent = REPLY.slice(0, Math.round(typed.n));
              },
            },
            0.92,
          );

          // Routed to the right person.
          tl.fromTo("#cn-handoff", { opacity: 0, scale: 0.7, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 1.7);

          tl.to("#cn-panel", { scale: 0.1, rotationX: 50, y: 150, opacity: 0, duration: 0.38, ease: "power2.in" }, 2.15);

          window.__timelines["chat-night"] = tl;
